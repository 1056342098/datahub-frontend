<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataHub - 科研数据管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(25, 25, 35, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 32px;
            color: #00c6ff;
            text-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00b4e6 0%, #0066cc 100%);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 114, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .btn-large {
            padding: 20px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 15px;
            margin-top: 40px;
        }

        /* 主内容区域 */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 40px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero-container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* 浮动粒子背景 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-1000px) rotate(720deg); }
        }

        /* 标题区域 */
        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
            background: linear-gradient(to right, #fff 0%, #00c6ff 50%, #0072ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: #b0b0b0;
            margin-bottom: 30px;
            font-weight: 300;
            line-height: 1.6;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 功能特性 */
        .features-section {
            padding: 100px 40px;
            background: rgba(0, 0, 0, 0.3);
        }

        .section-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 60px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background: rgba(25, 25, 35, 0.7);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-align: center;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 198, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0, 114, 255, 0.2);
        }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 25px;
            color: #00c6ff;
            height: 80px;
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            background: rgba(0, 198, 255, 0.1);
            border-radius: 50%;
            border: 1px solid rgba(0, 198, 255, 0.2);
        }

        .feature-card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #fff;
        }

        .feature-card p {
            font-size: 1rem;
            color: #b0b0b0;
            line-height: 1.6;
        }

        /* 统计数据 */
        .stats-section {
            padding: 80px 40px;
            background: rgba(25, 25, 35, 0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-label {
            font-size: 1.1rem;
            color: #b0b0b0;
            font-weight: 500;
        }

        /* CTA区域 */
        .cta-section {
            padding: 100px 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 114, 255, 0.1) 0%, transparent 70%);
            z-index: 1;
        }

        .cta-container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
        }

        .cta-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .cta-description {
            font-size: 1.2rem;
            color: #b0b0b0;
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 页脚 */
        .footer {
            background: rgba(25, 25, 35, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            text-align: center;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .footer-text {
            color: #888;
            font-size: 0.9rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }
            
            .logo-text {
                font-size: 24px;
            }
            
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-subtitle {
                font-size: 1.2rem;
            }
            
            .hero-section {
                padding: 100px 20px 40px;
            }
            
            .features-section, .stats-section, .cta-section {
                padding: 60px 20px;
            }
            
            .section-title, .cta-title {
                font-size: 2rem;
            }
            
            .btn-large {
                padding: 18px 35px;
                font-size: 16px;
            }
            
            .features-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .nav-buttons {
                gap: 10px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
            }
            
            .stat-number {
                font-size: 2.5rem;
            }
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .delay-1 {
            animation-delay: 0.2s;
        }

        .delay-2 {
            animation-delay: 0.4s;
        }

        .delay-3 {
            animation-delay: 0.6s;
        }

        /* 装饰元素 */
        .gradient-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            z-index: 1;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #00c6ff, transparent);
            top: 10%;
            left: 10%;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #0072ff, transparent);
            bottom: 20%;
            right: 10%;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-database"></i>
                </div>
                <div class="logo-text">DataHub</div>
            </a>
            
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-sign-in-alt"></i>
                    登录
                </a>
                <a href="register.html" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i>
                    注册
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main>
        <!-- 英雄区域 -->
        <section class="hero-section">
            <!-- 背景粒子 -->
            <div class="particles" id="particles"></div>
            
            <!-- 装饰圆圈 -->
            <div class="gradient-circle circle-1"></div>
            <div class="gradient-circle circle-2"></div>
            
            <div class="hero-container">
                <h1 class="hero-title animate-fade-in-up">
                    科研数据管理，从未如此简单
                </h1>
                
                <p class="hero-subtitle animate-fade-in-up delay-1">
                    DataHub 是一个专为科研秘书设计的智能数据管理平台，提供数据收集、整理、分析和协作的全流程解决方案，助力工作高效进行。
                </p>
                
                <a href="register.html" class="btn btn-primary btn-large animate-fade-in-up delay-2">
                    <i class="fas fa-rocket"></i>
                    立即开始使用
                </a>
            </div>
        </section>

    <script>
        // 创建背景粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 随机大小和位置
                const size = Math.random() * 6 + 2;
                const posX = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = Math.random() * 10 + 20;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // 滚动动画效果
        function initScrollAnimations() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate-fade-in-up');
                    }
                });
            }, observerOptions);
            
            // 观察需要动画的元素
            document.querySelectorAll('.feature-card, .stat-item, .section-title, .cta-title, .cta-description').forEach(el => {
                observer.observe(el);
            });
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            initScrollAnimations();
            
            // 为已加载的元素添加动画类
            setTimeout(() => {
                document.querySelectorAll('.animate-fade-in-up').forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }, 100);
        });
    </script>
</body>
</html>

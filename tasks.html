<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务列表 - DataHub 科研数据管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(25, 25, 35, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-title i {
            font-size: 26px;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #userInfo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        #userInfo:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        #userInfo i {
            color: #00c6ff;
        }

        /* 主容器 */
        .main-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 30px;
        }

        /* 页面头部 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header h2 i {
            color: #00c6ff;
            font-size: 24px;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00b4e6 0%, #0066cc 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 114, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #e63e5f 0%, #e64527 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(255, 65, 108, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ed573 0%, #1dd1a1 100%);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #29c469 0%, #1ac095 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(46, 213, 115, 0.3);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* 筛选区域 */
        .filter-section {
            background: rgba(25, 25, 35, 0.7);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 500;
            color: #b0b0b0;
        }

        .filter-group select {
            padding: 12px 16px;
            background: rgba(20, 20, 30, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 2px rgba(0, 198, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .filter-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 表格容器 */
        .table-container {
            background: rgba(25, 25, 35, 0.7);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: rgba(0, 114, 255, 0.15);
            border-bottom: 2px solid rgba(0, 114, 255, 0.3);
        }

        .data-table th {
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            color: #b0b0b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        .data-table tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .data-table td {
            padding: 18px 20px;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            min-width: 80px;
        }

        .status-ongoing {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .status-finished {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status-pending {
            background: rgba(108, 117, 125, 0.15);
            color: #6c757d;
            border: 1px solid rgba(108, 117, 125, 0.3);
        }

        .status-overdue {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .task-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .loading {
            text-align: center;
            padding: 50px !important;
            color: #888;
            font-size: 16px;
        }

        .loading i {
            margin-right: 10px;
            color: #00c6ff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 20px;
            color: #444;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination-btn {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border-color: transparent;
        }

        .pagination-info {
            font-size: 14px;
            color: #888;
            margin: 0 15px;
        }

        /* 错误消息 */
        .error-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            color: #ff6b6b;
            font-size: 14px;
            max-width: 400px;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(25, 25, 35, 0.7);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card i {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-card-ongoing i {
            color: #ffc107;
        }

        .stat-card-finished i {
            color: #2ed573;
        }

        .stat-card-overdue i {
            color: #ff4757;
        }

        .stat-card-total i {
            color: #00c6ff;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(25, 25, 35, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-header h3 {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header h3 i {
            color: #00c6ff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-body {
            margin-bottom: 30px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-user {
                width: 100%;
                justify-content: space-between;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            
            .page-header h2 {
                font-size: 24px;
            }
            
            .filter-grid {
                grid-template-columns: 1fr;
            }
            
            .data-table {
                display: block;
                overflow-x: auto;
            }
            
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .task-actions {
                flex-direction: column;
            }
            
            .modal-content {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 0 15px;
            }
            
            .navbar {
                padding: 15px;
            }
            
            .stats-cards {
                grid-template-columns: 1fr;
            }
            
            .pagination {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">
                <i class="fas fa-database"></i>
                DataHub
            </h1>
            <div class="nav-user">
                <div id="userInfo">
                    <i class="fas fa-user-circle"></i>
                    <span>科研秘书 - 张伟</span>
                </div>
                <button id="logoutBtn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 页面标题和操作 -->
        <div class="page-header">
            <h2>
                <i class="fas fa-tasks"></i>
                任务管理
            </h2>
            <button id="createTaskBtn" class="btn btn-primary">
                <i class="fas fa-plus-circle"></i>
                创建新任务
            </button>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card stat-card-total">
                <i class="fas fa-tasks"></i>
                <h3>总任务数</h3>
                <div class="value" id="totalTasks">0</div>
            </div>
            <div class="stat-card stat-card-ongoing">
                <i class="fas fa-spinner"></i>
                <h3>进行中</h3>
                <div class="value" id="ongoingTasks">0</div>
            </div>
            <div class="stat-card stat-card-finished">
                <i class="fas fa-check-circle"></i>
                <h3>已完成</h3>
                <div class="value" id="finishedTasks">0</div>
            </div>
            <div class="stat-card stat-card-overdue">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>已逾期</h3>
                <div class="value" id="overdueTasks">0</div>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="filter-section">
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="statusFilter">
                        <i class="fas fa-filter"></i>
                        状态筛选
                    </label>
                    <select id="statusFilter">
                        <option value="">全部状态</option>
                        <option value="Ongoing">进行中</option>
                        <option value="Finished">已完成</option>
                        <option value="Pending">待处理</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="deptFilter">
                        <i class="fas fa-building"></i>
                        学院筛选
                    </label>
                    <select id="deptFilter">
                        <option value="">全部学院</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="orderBy">
                        <i class="fas fa-sort-amount-down"></i>
                        排序字段
                    </label>
                    <select id="orderBy">
                        <option value="deadline">截止日期</option>
                        <option value="task_name">任务名称</option>
                        <option value="create_time">创建时间</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="orderDirection">
                        <i class="fas fa-sort"></i>
                        排序方向
                    </label>
                    <select id="orderDirection">
                        <option value="asc">升序</option>
                        <option value="desc">降序</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button id="applyFilterBtn" class="btn btn-primary">
                    <i class="fas fa-filter"></i>
                    应用筛选
                </button>
                <button id="resetFilterBtn" class="btn btn-secondary">
                    <i class="fas fa-redo"></i>
                    重置筛选
                </button>
            </div>
        </div>

        <!-- 表格容器 -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>任务ID</th>
                        <th>任务名称</th>
                        <th>学院</th>
                        <th>状态</th>
                        <th>截止日期</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <tr>
                        <td colspan="7" class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            加载任务数据中...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination">
            <button class="pagination-btn" id="prevPageBtn" disabled>
                <i class="fas fa-chevron-left"></i>
                上一页
            </button>
            <span class="pagination-info" id="pageInfo">第 1 页 / 共 1 页</span>
            <button class="pagination-btn" id="nextPageBtn" disabled>
                下一页
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- 错误消息 -->
    <div id="errorMessage" class="error-message"></div>

    <!-- 创建任务模态框 -->
    <div id="createTaskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>
                    <i class="fas fa-plus-circle"></i>
                    创建新任务
                </h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="taskForm">
                    <div class="filter-group" style="margin-bottom: 20px;">
                        <label for="taskName">任务名称</label>
                        <input type="text" id="taskName" required style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; font-size: 14px;" placeholder="请输入任务名称">
                    </div>
                    <div class="filter-group" style="margin-bottom: 20px;">
                        <label for="taskDept">分配学院</label>
                        <select id="taskDept" required style="width: 100%;">
                            <option value="">请选择学院</option>
                        </select>
                    </div>
                    <div class="filter-group" style="margin-bottom: 20px;">
                        <label for="taskPriority">优先级</label>
                        <select id="taskPriority" required style="width: 100%;">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                            <option value="urgent">紧急</option>
                        </select>
                    </div>
                    <div class="filter-group" style="margin-bottom: 20px;">
                        <label for="taskDeadline">截止日期</label>
                        <input type="date" id="taskDeadline" required style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; font-size: 14px;">
                    </div>
                    <div class="filter-group" style="margin-bottom: 20px;">
                        <label for="taskDescription">任务描述</label>
                        <textarea id="taskDescription" rows="4" style="width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; font-size: 14px; resize: vertical;" placeholder="请输入任务详细描述"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancelTaskBtn">
                    取消
                </button>
                <button type="submit" form="taskForm" class="btn btn-primary" id="submitTaskBtn">
                    <i class="fas fa-check"></i>
                    创建任务
                </button>
            </div>
        </div>
    </div>


    <!-- 保留原有的外部JS文件引用 -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>

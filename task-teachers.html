<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师列表 - DataHub 科研数据管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(25, 25, 35, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-title i {
            font-size: 26px;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #userInfo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        #userInfo:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        #userInfo i {
            color: #00c6ff;
        }

        /* 主容器 */
        .main-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 30px;
        }

        /* 页面头部 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header h2 i {
            color: #00c6ff;
            font-size: 24px;
        }

        /* 操作按钮区域 */
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00b4e6 0%, #0066cc 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 114, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ed573 0%, #1dd1a1 100%);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #29c469 0%, #1ac095 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(46, 213, 115, 0.3);
        }

        .download-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .download-btn:hover:not(:disabled) {
            background: rgba(0, 198, 255, 0.15);
            color: #00c6ff;
            border-color: rgba(0, 198, 255, 0.4);
        }

        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .text-muted {
            color: #7a7a7a;
            font-size: 13px;
        }

        /* 筛选区域 */
        .filter-section {
            background: rgba(25, 25, 35, 0.7);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 500;
            color: #b0b0b0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label i {
            color: #00c6ff;
            font-size: 14px;
        }

        .filter-group select {
            padding: 12px 16px;
            background: rgba(20, 20, 30, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 40px;
            min-width: 180px;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 2px rgba(0, 198, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* 表格容器 */
        .table-container {
            background: rgba(25, 25, 35, 0.7);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: rgba(0, 114, 255, 0.15);
            border-bottom: 2px solid rgba(0, 114, 255, 0.3);
        }

        .data-table th {
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            color: #b0b0b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        .data-table tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .data-table td {
            padding: 18px 20px;
            font-size: 14px;
            vertical-align: middle;
        }

        /* 状态徽章 */
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            min-width: 80px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .status-submitted {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .status-late {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 50px !important;
            color: #888;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .loading i {
            font-size: 32px;
            color: #00c6ff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 20px;
            color: #444;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination-btn {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border-color: transparent;
        }

        .pagination-info {
            font-size: 14px;
            color: #888;
            margin: 0 15px;
        }

        /* 错误消息 */
        .error-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            color: #ff6b6b;
            font-size: 14px;
            max-width: 400px;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .success-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            color: #2ed573;
            font-size: 14px;
            max-width: 400px;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 统计卡片 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(25, 25, 35, 0.7);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card i {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-card-pending i {
            color: #ffc107;
        }

        .stat-card-submitted i {
            color: #2ed573;
        }

        .stat-card-total i {
            color: #00c6ff;
        }

        .stat-card-late i {
            color: #ff4757;
        }

        /* 教师信息样式 */
        .teacher-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .teacher-details {
            display: flex;
            flex-direction: column;
        }

        .teacher-name {
            font-weight: 600;
            color: #fff;
        }

        .teacher-id {
            font-size: 12px;
            color: #888;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-user {
                width: 100%;
                justify-content: space-between;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            
            .page-header h2 {
                font-size: 24px;
            }
            
            .action-buttons {
                width: 100%;
                justify-content: flex-start;
            }
            
            .action-buttons .btn {
                flex: 1;
                min-width: 140px;
                justify-content: center;
            }
            
            .filter-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .filter-group select {
                flex: 1;
            }
            
            .data-table {
                display: block;
                overflow-x: auto;
            }
            
            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 0 15px;
            }
            
            .navbar {
                padding: 15px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-buttons .btn {
                width: 100%;
            }
            
            .stats-cards {
                grid-template-columns: 1fr;
            }
            
            .pagination {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">
                <i class="fas fa-database"></i>
                DataHub
            </h1>
            <div class="nav-user">
                <div id="userInfo">
                    <i class="fas fa-user-circle"></i>
                    <span>科研秘书 - 张伟</span>
                </div>
                <button id="logoutBtn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 页面标题和操作 -->
        <div class="page-header">
            <h2 id="taskTitle">
                <i class="fas fa-chalkboard-teacher"></i>
                <span id="dynamicTaskName">科研数据收集</span> - 教师列表
            </h2>
            <div class="action-buttons">
                <button id="remindBtn" class="btn btn-primary">
                    <i class="fas fa-bell"></i>
                    提醒未提交教师
                </button>
                <button id="exportBtn" class="btn btn-success">
                    <i class="fas fa-file-export"></i>
                    导出提交
                </button>
                <a href="tasks.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    返回列表
                </a>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card stat-card-total">
                <i class="fas fa-users"></i>
                <h3>总教师数</h3>
                <div class="value" id="totalTeachers">0</div>
            </div>
            <div class="stat-card stat-card-submitted">
                <i class="fas fa-check-circle"></i>
                <h3>已提交</h3>
                <div class="value" id="submittedTeachers">0</div>
            </div>
            <div class="stat-card stat-card-pending">
                <i class="fas fa-clock"></i>
                <h3>待提交</h3>
                <div class="value" id="pendingTeachers">0</div>
            </div>
        </div>

        <!-- 筛选区域 -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="statusFilter">
                    <i class="fas fa-filter"></i>
                    提交状态：
                </label>
                <select id="statusFilter">
                    <option value="">全部状态</option>
                    <option value="Pending">待提交</option>
                    <option value="Submitted">已提交</option>
                </select>
            </div>
            <button id="applyFilterBtn" class="btn btn-primary">
                <i class="fas fa-filter"></i>
                应用筛选
            </button>
        </div>

        <!-- 表格容器 -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>教师ID</th>
                        <th>姓名</th>
                        <th>邮箱</th>
                        <th>提交状态</th>
                        <th>提交时间</th>
                        <th>提交附件</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    <tr>
                        <td colspan="6" class="loading">
                            <i class="fas fa-spinner fa-spin"></i>
                            加载教师数据中...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination">
            <button class="pagination-btn" id="prevPageBtn" disabled>
                <i class="fas fa-chevron-left"></i>
                上一页
            </button>
            <span class="pagination-info" id="pageInfo">第 1 页 / 共 1 页</span>
            <button class="pagination-btn" id="nextPageBtn" disabled>
                下一页
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <!-- 消息区域 -->
    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>


    <!-- 保留原有的外部JS文件引用 -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/task-teachers.js"></script>
</body>
</html>

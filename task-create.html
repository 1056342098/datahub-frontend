<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建任务 - DataHub 科研数据管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(25, 25, 35, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-title i {
            font-size: 26px;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #userInfo {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        #userInfo:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        #userInfo i {
            color: #00c6ff;
        }

        /* 主容器 */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 30px;
        }

        /* 页面头部 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-header h2 i {
            color: #00c6ff;
            font-size: 24px;
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00b4e6 0%, #0066cc 100%);
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 114, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        /* 表单卡片 */
        .form-card {
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00c6ff, #0072ff, #00c6ff);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 表单样式 */
        #taskForm {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: #b0b0b0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group label i {
            color: #00c6ff;
            font-size: 12px;
        }

        .form-group label::after {
            content: attr(data-required);
            color: #ff4757;
            font-size: 12px;
            margin-left: 5px;
        }

        .form-group label:not([data-required])::after {
            content: '';
        }

        .input-container {
            position: relative;
        }

        .input-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            transition: color 0.3s;
            z-index: 1;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(20, 20, 30, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            resize: vertical;
        }

        textarea {
            min-height: 120px;
            font-family: inherit;
            line-height: 1.5;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00c6ff;
            box-shadow: 0 0 0 2px rgba(0, 198, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        input:focus + i, select:focus + i {
            color: #00c6ff;
        }

        input::placeholder, textarea::placeholder {
            color: #666;
        }

        small {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            display: block;
            line-height: 1.4;
        }

        /* 表单操作 */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 20px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 错误消息 */
        .error-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            color: #ff6b6b;
            font-size: 14px;
            max-width: 400px;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .success-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            color: #2ed573;
            font-size: 14px;
            max-width: 400px;
            display: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 文件上传区域 */
        .file-upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-upload-area:hover {
            border-color: rgba(0, 198, 255, 0.3);
            background: rgba(0, 198, 255, 0.05);
        }

        .file-upload-area i {
            font-size: 48px;
            color: #666;
            margin-bottom: 15px;
        }

        .file-upload-area h4 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #b0b0b0;
        }

        .file-upload-area p {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .file-upload-area .btn {
            margin-top: 10px;
        }

        /* 模板预览区域 */
        .template-preview {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 20px;
            margin-top: 10px;
            border-left: 3px solid #00c6ff;
        }

        .template-preview h5 {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .template-preview h5 i {
            color: #00c6ff;
        }

        .template-preview p {
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-user {
                width: 100%;
                justify-content: space-between;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            
            .page-header h2 {
                font-size: 24px;
            }
            
            .form-card {
                padding: 25px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .form-actions .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 0 15px;
            }
            
            .navbar {
                padding: 15px;
            }
        }

        /* 表单验证样式 */
        input:invalid, select:invalid, textarea:invalid {
            border-color: rgba(255, 71, 87, 0.3);
        }

        input:valid:not(:placeholder-shown), select:valid, textarea:valid:not(:placeholder-shown) {
            border-color: rgba(46, 213, 115, 0.3);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">
                <i class="fas fa-database"></i>
                DataHub
            </h1>
            <div class="nav-user">
                <div id="userInfo">
                    <i class="fas fa-user-circle"></i>
                    <span>科研秘书 - 张伟</span>
                </div>
                <button id="logoutBtn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 页面标题和操作 -->
        <div class="page-header">
            <h2 id="pageTitle">
                <i class="fas fa-plus-circle"></i>
                创建任务
            </h2>
            <a href="tasks.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i>
                返回列表
            </a>
        </div>

        <!-- 表单卡片 -->
        <div class="form-card">
            <form id="taskForm">
                <div class="form-group">
                    <label for="task_name" data-required="*">
                        <i class="fas fa-heading"></i>
                        任务名称
                    </label>
                    <div class="input-container">
                        <i class="fas fa-tasks"></i>
                        <input type="text" id="task_name" name="task_name" required placeholder="请输入任务名称">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">
                        <i class="fas fa-file-alt"></i>
                        任务描述
                    </label>
                    <div class="input-container">
                        <i class="fas fa-align-left"></i>
                        <textarea id="description" name="description" rows="4" placeholder="请输入任务详细描述（可选）"></textarea>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="template_file" data-required="*">
                        <i class="fas fa-file-excel"></i>
                        模板文件
                    </label>
                    <div class="input-container">
                        <i class="fas fa-folder-open"></i>
                        <input type="file" id="template_file" name="template_file" accept=".xlsx,.xls" required>
                    </div>
                    <small>请从本地上传Excel模板文件（.xlsx 或 .xls，大小不超过 10MB）</small>
                    
                    <div class="template-preview">
                        <h5><i class="fas fa-info-circle"></i> 模板文件要求</h5>
                        <p>1. 必须是.xlsx或.xls格式的Excel文件</p>
                        <p>2. 文件大小不超过10MB</p>
                        <p>3. 应包含必要的数据字段和格式规范</p>
                        <p>4. 建议使用统一的模板命名规范</p>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="dept_id" data-required="*">
                        <i class="fas fa-building"></i>
                        所属学院
                    </label>
                    <div class="input-container">
                        <i class="fas fa-users"></i>
                        <select id="dept_id" name="dept_id" required>
                            <option value="">请选择学院</option>
                        </select>
                    </div>
                    <small>选择负责执行此任务的学院</small>
                </div>
                
                <div class="form-group">
                    <label for="deadline" data-required="*">
                        <i class="fas fa-calendar-alt"></i>
                        截止日期
                    </label>
                    <div class="input-container">
                        <i class="far fa-clock"></i>
                        <input type="datetime-local" id="deadline" name="deadline" required>
                    </div>
                    <small>设置任务的截止日期和时间</small>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-check-circle"></i>
                        创建任务
                    </button>
                    <a href="tasks.html" class="btn btn-secondary">
                        <i class="fas fa-times-circle"></i>
                        取消
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- 消息区域 -->
    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <script>
        // DOM元素
        const taskForm = document.getElementById('taskForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        
        // 初始化日期时间选择器（设置为明天）
        function initializeDateTimePicker() {
            const now = new Date();
            // 设置为明天
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            // 格式化日期时间字符串
            const year = tomorrow.getFullYear();
            const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const day = String(tomorrow.getDate()).padStart(2, '0');
            const hours = String(tomorrow.getHours()).padStart(2, '0');
            const minutes = String(tomorrow.getMinutes()).padStart(2, '0');
            
            const dateTimeString = `${year}-${month}-${day}T${hours}:${minutes}`;
            document.getElementById('deadline').value = dateTimeString;
        }
        
        // 显示消息
        function showMessage(message, type = 'error') {
            if (type === 'success') {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            } else {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        }
        
        // 初始化日期时间选择器
        document.addEventListener('DOMContentLoaded', function() {
            initializeDateTimePicker();
        });
    </script>

    <!-- 保留原有的外部JS文件引用 -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/task-create.js"></script>
</body>
</html>
